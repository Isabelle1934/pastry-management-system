# PostgreSQL local para desenvolvimento.
# Uso: docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
name: confeitaria-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confeitaria}
      POSTGRES_USER: ${POSTGRES_USER:-confeitaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confeitaria_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
