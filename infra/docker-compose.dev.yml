# PostgreSQL local para desenvolvimento.
# Uso: docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
name: confeitaria-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confeitaria}
      POSTGRES_USER: ${POSTGRES_USER:-confeitaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confeitaria_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de e-mail local: captura os e-mails enviados (ex.: redefinição de senha).
  # Interface: http://localhost:8025 — SMTP: localhost:1025. Nada é entregue de verdade.
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
