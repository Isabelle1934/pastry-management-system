# Produção: PostgreSQL + API + Caddy (frontend e HTTPS) + backups diários.
# Uso (na raiz do projeto, com o arquivo .env.prod preenchido a partir de .env.prod.example):
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
name: confeitaria

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: UTC
    # Sem portas publicadas: o banco só é acessível pela rede interna.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?defina APP_PUBLIC_BASE_URL}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_CORS_ALLOWED_ORIGINS: ""
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-}
      APP_ADMIN_INITIAL_PASSWORD: ${APP_ADMIN_INITIAL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?defina APP_MAIL_FROM}
    # Sem portas publicadas: só o Caddy chega ao backend (os limites por IP confiam nisso).
    volumes:
      - uploads:/var/lib/confeitaria/uploads

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Backup diário do banco e dos arquivos enviados, mantido por BACKUP_KEEP_DAYS dias.
  # Copie a pasta de backups para fora do servidor (ver docs/DEPLOYMENT.md).
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: America/Sao_Paulo
    volumes:
      - ./backup:/scripts:ro
      - uploads:/uploads:ro
      - ${BACKUP_DIR:-../backups}:/backups
    entrypoint: ["sh", "/scripts/backup-loop.sh"]

  # Restauração manual (apaga os dados atuais). Ver docs/DEPLOYMENT.md:
  #   docker compose ... stop backend
  #   docker compose ... run --rm restore <pasta-do-backup> --confirm
  #   docker compose ... start backend
  restore:
    image: postgres:18-alpine
    profiles: ["restore"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/scripts:ro
      - uploads:/uploads
      - ${BACKUP_DIR:-../backups}:/backups:ro
    entrypoint: ["sh", "/scripts/restore.sh"]

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
