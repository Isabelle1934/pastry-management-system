# Produção: todas as credenciais vêm obrigatoriamente de variáveis de ambiente (sem valores padrão).
server:
  forward-headers-strategy: framework

# Sem valores padrão: a aplicação não sobe em produção sem estas variáveis.
app:
  mail:
    from: ${APP_MAIL_FROM}
  auth:
    public-base-url: ${APP_PUBLIC_BASE_URL}
  storage:
    upload-dir: ${APP_UPLOAD_DIR}

logging:
  level:
    root: INFO
