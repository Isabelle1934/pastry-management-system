spring:
  application:
    name: confeitaria-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
  session:
    timeout: 8h
    jdbc:
      # Tabelas criadas pela migration V1 (Flyway), nunca pelo Spring Session.
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Cookie de sessão configurado em SecurityConfig#cookieSerializer (Spring Session).
      timeout: 8h

logging:
  pattern:
    # requestId (RequestIdFilter) em todas as linhas para relacionar erro exibido e log.
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      base-path: /api/public
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Indisponibilidade do SMTP não deve marcar a aplicação inteira como fora do ar.
    mail:
      enabled: false

app:
  timezone: America/Sao_Paulo
  cors:
    # Em produção o frontend é servido no mesmo domínio: lista vazia = CORS desabilitado.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${APP_MAIL_FROM:nao-responda@localhost}
  auth:
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
    cookie-secure: ${APP_COOKIE_SECURE:true}
    bootstrap:
      email: ${APP_ADMIN_EMAIL:}
      name: ${APP_ADMIN_NAME:}
      password: ${APP_ADMIN_INITIAL_PASSWORD:}
