spring:
  application:
    name: confeitaria-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /api/public
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: America/Sao_Paulo
  cors:
    # Em produção o frontend é servido no mesmo domínio: lista vazia = CORS desabilitado.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
